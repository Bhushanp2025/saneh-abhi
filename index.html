<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Saneh</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top left, rgba(99, 102, 241, 0.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.35), transparent 35%),
        linear-gradient(135deg, #0f172a, #111827);
      color: #fff;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 48px 36px;
      border-radius: 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
      animation: floatIn 0.8s ease forwards;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      margin-bottom: 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #c7d2fe;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: clamp(36px, 8vw, 64px);
      line-height: 1.05;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #fff, #c7d2fe, #fbcfe8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: 16px;
      background: #ffffff;
      color: #111827;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(255, 255, 255, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 38px rgba(255, 255, 255, 0.25);
    }

    .glow {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(129, 140, 248, 0.35);
      filter: blur(55px);
      z-index: -1;
    }

    .glow.one {
      top: 18%;
      left: 18%;
    }

    .glow.two {
      bottom: 18%;
      right: 18%;
      background: rgba(244, 114, 182, 0.35);
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="card">
    <span class="badge">Welcome</span>
    <h1>Hello, I’m Saneh</h1>
    <p>A clean, modern landing page with a soft glass UI and glowing background.</p>
    <a href="#" class="button">Explore More</a>
  </main>
</body>
</html>
