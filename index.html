<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Saneh</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at center, #0f172a, #020617);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

/* Cursor Glow */
.cursor {
  position: fixed;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(99,102,241,0.25), transparent 60%);
  pointer-events: none;
  transform: translate(-50%, -50%);
}

/* Stars background */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  opacity: 0.5;
  animation: moveStars linear infinite;
}

@keyframes moveStars {
  from { transform: translateY(0); }
  to { transform: translateY(-100vh); }
}

/* Card */
.card {
  width: 520px;
  padding: 50px;
  border-radius: 25px;
  text-align: center;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  transition: transform 0.2s ease;
  position: relative;
}

/* Neon border pulse */
.card::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 25px;
  background: linear-gradient(45deg, #6366f1, #ec4899, #22c55e);
  z-index: -1;
  filter: blur(12px);
  opacity: 0.6;
  animation: glowPulse 4s infinite linear;
}

@keyframes glowPulse {
  0% { filter: blur(10px) hue-rotate(0deg); }
  100% { filter: blur(20px) hue-rotate(360deg); }
}

/* Heading */
h1 {
  font-size: 48px;
  margin-bottom: 15px;
  background: linear-gradient(90deg, #fff, #a5b4fc, #f9a8d4);
  -webkit-background-clip: text;
  color: transparent;
}

/* Typing text */
.typing {
  font-size: 18px;
  color: #cbd5e1;
  border-right: 2px solid white;
  width: 0;
  overflow: hidden;
  white-space: nowrap;
  animation: typing 4s steps(40) forwards, blink 0.7s infinite;
}

@keyframes typing {
  to { width: 100%; }
}

@keyframes blink {
  50% { border-color: transparent; }
}

/* Button */
.button {
  margin-top: 30px;
  display: inline-block;
  padding: 14px 28px;
  border-radius: 12px;
  background: linear-gradient(135deg, #6366f1, #ec4899);
  text-decoration: none;
  color: white;
  font-weight: bold;
  transition: 0.3s;
}

.button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 25px rgba(236,72,153,0.6);
}

</style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<!-- Stars -->
<script>
for (let i = 0; i < 80; i++) {
  let star = document.createElement("div");
  star.className = "star";
  star.style.left = Math.random() * 100 + "vw";
  star.style.top = Math.random() * 100 + "vh";
  star.style.animationDuration = (5 + Math.random() * 10) + "s";
  document.body.appendChild(star);
}
</script>

<!-- Card -->
<div class="card" id="card">
  <h1>Hello, I’m Saneh</h1>
  <div class="typing">Creative Developer • UI Designer • Dream Builder</div>
  <a href="#" class="button">Enter Experience 🚀</a>
</div>

<script>
// Cursor glow follow
document.addEventListener("mousemove", e => {
  document.getElementById("cursor").style.left = e.clientX + "px";
  document.getElementById("cursor").style.top = e.clientY + "px";
});

// 3D tilt effect
const card = document.getElementById("card");

card.addEventListener("mousemove", (e) => {
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const rotateX = (y / rect.height - 0.5) * 10;
  const rotateY = (x / rect.width - 0.5) * -10;

  card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});

card.addEventListener("mouseleave", () => {
  card.style.transform = "rotateX(0) rotateY(0)";
});
</script>

</body>
</html>
